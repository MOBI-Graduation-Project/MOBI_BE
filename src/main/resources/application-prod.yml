spring:
  jackson:
    time-zone: Asia/Seoul

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: 6379
      ssl: true

  #datasource:
  #  url: ${DB_URL}?serverTimezone=Asia/Seoul
  #  username: ${DB_USERNAME}
  #  password: ${DB_PWD}
  #  driver-class-name: com.mysql.cj.jdbc.Driver
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      maxFileSize: 10MB
      maxRequestSize: 50MB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: https://api.mobi.ai.kr/auth/callback


  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini

server:
  port: ${SERVER_PORT:5000}
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto

aws:
  s3:
    bucket: ${S3_BUCKET}
    defaultProfileUrl: ${DEFAULT_PROFILE_URL}
  credentials:
    access-key: ${AWS_ACCESS_KEY}
    secret-key: ${AWS_SECRET_KEY}
  region: ap-northeast-2

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    s3:
      bucket: ${S3_BUCKET}

jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-validity-in-seconds: 3600
  refresh-token-validity-in-seconds: 1209600
  #access-token:
  #  expiration: ${JWT_ACCESS_EXPIRATION}
  #refresh-token:
  #  expiration: ${JWT_REFRESH_EXPIRATION}


urls:
  frontend: "https://mobi.ai.kr"
  backend:  "https://api.mobi.ai.kr"

api:
  krx:
    key: ${KRX_API_KEY}
